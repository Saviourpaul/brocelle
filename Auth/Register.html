<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <title>Auth Sign Up | Aquiry Admin &amp; Dashboard Template </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, ">
    <meta content="Admin & Dashboard Template" name="description">
    <meta content="Codebucks" name="author">
    
    <!-- layout setup -->
    <!-- <script type="module" src="../Admin/assets/js/layout-setup.js"></script> -->
    
    <!-- App favicon -->
    <link rel="shortcut icon" href="../Admin/assets/images/logo-sm.png">
    <!-- Simplebar Css -->
    <link rel="stylesheet" href="../Admin/assets/libs/simplebar/simplebar.min.css">
    
    <!-- Bootstrap Css -->
    <link href="../Admin/assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css">
    
    <!--icons css-->
    <link href="../Admin/assets/css/icons.min.css" rel="stylesheet" type="text/css">
    
    <!-- App Css-->
    <link href="../Admin/assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css">
    <script type="module" src="../assets/js/RegisterAuth.js"></script>


</head>

<body>
<div class="position-relative min-vh-100">
    <div class="row gx-0">
        <div class="col-xl-5" >
            <div class="row justify-content-center align-items-center p-10 min-vh-100 bg-body-secondary position-relative">
                <div class="col-md-7 col-lg-6 col-xl-8 col-xxl-7">
                    <a href="../index.html" class="text-nowrap d-block w-100">
                        <img src="../assets/img/logo/nav-log.png" class="dark-logo" height="30" alt="Logo-Dark">
                    </a>
                    <h3 class="mb-3 mt-8">Register</h3>
                    <p class="text-muted mb-8">Register Today  to explore your Groceries.</p>
                    <form id="registerForm" method="post" >
                        <div id="RegisterMessage" class="MessageDiv" style="display: none;"></div>
                        
                       
                        <div class="mb-5">
                            <label for="FirstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="FirstName" name="first_name" placeholder="Enter your first name" required>
                        </div>
                         <div class="mb-5">
                            <label for="LastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="LastName" name="last_name" placeholder="Enter your last name" required>
                        </div>
                       
                        <div class="mb-5">
                            <label for="Email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="Email" name="Email" placeholder="email" required>
                        </div>
                          <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" 
                                   placeholder="Enter password" required>
                            <button class="btn btn-outline-primary" type="button" id="togglePassword" title="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                        <div class="mt-6 mb-8 d-flex justify-content-between align-items-center">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="customControlInline">
                                <label class="form-check-label" for="customControlInline">Remember me</label>
                            </div>
                            <a href="reset-password.html" class="text-muted"><i class="mdi mdi-lock me-1"></i> Forgot your password?</a>
                        </div>
                        <button id="submitRegister" class="btn btn-primary w-100" >
                            Sign Up
                        </button>
                        <div class="mt-4">
                            <button id="googleSignUp" type="button" class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-google"></i> Sign Up with Google
                            </button>
                        </div>
                        <div class="mt-5">
                            <p class="mb-0">Already have an account ? <a href="login.html" class="fw-medium text-primary"> Sign In </a> </p>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
        <div class="col-xl-7 d-none d-md-block">
        <div class="vh-100 d-flex flex-column justify-content-center align-items-center"
                style="
                background-image: url('../assets/img/product/big-product1.jpg');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;">
               
                <div class="text-center z-index-2">
                    <p class="display-4 text fw-normal mb-6" style="color:white;">
                        <strong>Natural is always Healthy</strong>
                         

                    </p>
                    
                </div>

            </div>
        </div>
    </div>
</div>




<script src="../assets/js/togglePassword.js"></script>

<!-- Firebase js -->
<script type="module" src="../assets/js/RegisterAuth.js"></script>

<!-- Bootstrap bundle js -->
<script src="../Admin/assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>

<!-- Layouts main js -->
<script src="../Admin/assets/libs/jquery/jquery.min.js"></script>

<!-- Metimenu js -->
<script src="../Admin/assets/libs/metismenu/metisMenu.min.js"></script>

<!-- simplebar js -->
<script src="../Admin/assets/libs/simplebar/simplebar.min.js"></script>

<script src="../Admin/assets/libs/eva-icons/eva.min.js"></script>

<!-- Scroll Top init -->
<script src="../Admin/assets/js/scroll-top.init.js"></script>
<!-- App js -->
<script src="../Admin/assets/js/app.js"></script>

</body>


</html>
